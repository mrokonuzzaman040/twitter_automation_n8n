<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Agents - Research</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div id="login" class="card hidden">
  <h2>Social Agents</h2>
  <form id="loginForm">
    <label>Admin password</label>
    <input type="password" id="password" autofocus>
    <div class="actions"><button class="primary">Sign in</button></div>
    <div id="loginErr" class="err small"></div>
  </form>
</div>

<div id="app" class="hidden">
  <button class="menu-toggle">☰</button>
  <aside>
    <button class="sidebar-toggle">◀</button>
    <div class="brand">
      <div class="logo">S</div>
      <span>Social Agents</span>
    </div>
    <nav>
      <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="label">Dashboard</span></a>
      <a href="/approvals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg><span class="label">Approvals</span> <span id="pendingCount" class="badge hidden"></span></a>
      <a href="/content"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg><span class="label">Content</span></a>
      <a href="/research" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="label">Research</span></a>
      <a href="/logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span class="label">Logs</span></a>
      <a href="/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span class="label">Settings</span></a>
    </nav>
    <div class="side-foot">
      <span id="masterBadge" class="badge">…</span>
      <button id="logout">Sign out</button>
    </div>
  </aside>

  <div class="content">
    <nav class="navbar">
      <div class="navbar-left">
        <div class="navbar-brand">
          <div class="logo" style="width:28px;height:28px;font-size:10px;">S</div>
          <span>Social Agents</span>
        </div>
      </div>
      <div class="navbar-right">
        <button class="navbar-btn theme-toggle" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button class="navbar-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notification-badge hidden" id="notificationCount">0</span>
        </button>
        <div class="profile-dropdown">
          <div class="profile-btn">
            <div class="profile-avatar">A</div>
            <span class="profile-name">Admin</span>
          </div>
          <div class="profile-menu">
            <a href="/settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h3M20 12h3M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              Settings
            </a>
            <div class="profile-menu-divider"></div>
            <a href="#" id="logoutBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Sign out
            </a>
          </div>
        </div>
      </div>
    </nav>
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Research</h1>
        <p id="pageSub">What the research agent found on the last cycle</p>
      </div>
    </div>
    <main>
<div class="card row"><select id="researchAccount" style="width:auto"></select></div>
<div id="researchBody"></div>
    </main>
  </div>
</div>

<div id="toastStack" class="toast-stack"></div>

<script src="/static/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
const CATEGORIES = { latest_news: 'Latest news', b2b_offers: 'Recent B2B offers', trending_topics: 'Trending topics',
                     viral_posts: 'Viral posts', viral_content: 'Viral content',
                     social_trending: 'Top posts on the platform', target_profiles: 'Target profiles' };

async function loadResearch() {
  const id = $('researchAccount').value; if (!id) { $('researchBody').innerHTML = ''; return; }
  const r = await api(`/accounts/${id}/research`);
  let html = '';
  if (r.brief) {
    html += `<div class="card"><h2>Brief · ${when(r.brief.created_at)}</h2><p>${esc(r.brief.brief.summary)}</p>
      ${r.brief.brief.target_insights ? `<p><b>What works for target profiles:</b> ${esc(r.brief.brief.target_insights)}</p>` : ''}
      <table><thead><tr><th>Category</th><th>Angle</th><th>Insight</th></tr></thead><tbody>` +
      (r.brief.brief.angles || []).map(a => `<tr><td>${badge('', CATEGORIES[a.category] || a.category)}</td>
        <td>${safeUrl(a.url) ? `<a href="${safeUrl(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a>` : esc(a.title)}</td>
        <td>${esc(a.insight)}</td></tr>`).join('') + '</tbody></table></div>';
    for (const [key, label] of Object.entries(CATEGORIES)) {
      const items = r.items.filter(i => i.category === key);
      html += `<div class="card"><h2>${label} <span class="muted">(${items.length})</span></h2>` +
        (items.map(i => `<div style="margin-bottom:8px">${safeUrl(i.url) ? `<a href="${safeUrl(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a>` : esc(i.title)}
          <span class="small muted"> · ${esc(i.source)}${i.score ? ' · ' + i.score.toLocaleString() : ''}</span>
          <div class="small muted">${esc(i.summary.slice(0, 220))}</div></div>`).join('') || '<span class="muted small">Nothing found this run.</span>') + '</div>';
    }
  } else html += '<div class="card muted">No research yet for this account.</div>';
  html += `<div class="card"><h2>Recent cycles</h2><table><tbody>` + (r.runs.map(x =>
    `<tr><td>#${x.id}</td><td>${when(x.started_at)}</td><td>${badge(x.status)}</td><td class="small err">${esc(x.error)}</td></tr>`).join('')
    || '<tr><td class="muted">None</td></tr>') + '</tbody></table></div>';
  $('researchBody').innerHTML = html;
}

$('researchAccount').onchange = loadResearch;

boot(data => {
  const sel = $('researchAccount');
  sel.innerHTML = data.accounts.map(a => `<option value="${a.id}">@${esc(a.handle)} (${esc(a.platform)})</option>`).join('');
  if (data.accounts.length) loadResearch();
});
});
</script>
</body>
</html>
