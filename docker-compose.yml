services:
  # Admin panel + JSON API
  web:
    build: .
    image: social-agents
    command: uvicorn app.web:app --host 0.0.0.0 --port 8080
    env_file: .env
    ports:
      # Bound to localhost only. Put a reverse proxy with TLS in front before exposing it.
      - "127.0.0.1:${PANEL_PORT:-8080}:8080"
    volumes:
      - data:/data
    restart: unless-stopped

  # Master agent: syncs the accounts sheet and runs one agent per account
  worker:
    build: .
    image: social-agents
    command: python -m app.master
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped

  # Workflow automation on top of the agents: receives their events, can call the panel API
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.4
    entrypoint: ["/bin/sh", "/workflows/start.sh"]
    environment:
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"            # plain http on localhost
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # workflows read the two variables below
      SOCIAL_AGENTS_URL: http://web:8080
      SOCIAL_AGENTS_TOKEN: ${API_TOKEN}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    restart: unless-stopped

volumes:
  data:
  n8n_data:
